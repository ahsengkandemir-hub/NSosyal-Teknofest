<script>
function sayfaAc(sayfaId, baslik) {
document.getElementById('anaSayfa').classList.add('hidden');
document.getElementById('basvurularim').classList.add('hidden');
document.getElementById('basvuruTalepleri').classList.add('hidden');
document.getElementById('favorilerim').classList.add('hidden');
document.getElementById(sayfaId).classList.remove('hidden');
document.getElementById('sayfaBaslik').innerText = baslik;
document.getElementById('menu').classList.add('hidden');
}
function filtreuygulama() {
const sectigimfilteler = document.querySelectorAll(
'.filtrealanlari.bg-green-500');
const anasayfailanlari = document.querySelectorAll(
'#anaSayfa [data-alan]');
const basvurutalepleri = document.querySelectorAll(
'#kartlar [data-alan]');
if (sectigimfilteler.length == 0) {
anasayfailanlari.forEach(function(ilan) {
ilan.classList.remove('hidden');
});
basvurutalepleri.forEach(function(kart) {
kart.classList.remove('hidden');
});
}
else {
anasayfailanlari.forEach(function(ilan) { const ilanalani = ilan.getAttribute('data-alan');
let goster = false;
sectigimfilteler.forEach(function(filtre) {const filtrealani = filtre.getAttribute('data-alan');
if (ilanalani == filtrealani) {
goster = true;
}
});
if (goster) {
ilan.classList.remove('hidden');
} else {
ilan.classList.add('hidden');
}
});
basvurutalepleri.forEach(function(kart) {
const kartalani = kart.getAttribute('data-alan');
let goster = false;
sectigimfilteler.forEach(function(filtre) {
const filtrealani = filtre.getAttribute('data-alan');
if (kartalani == filtrealani) {
goster = true;
}
});
if (goster) {
kart.classList.remove('hidden');
} else {
kart.classList.add('hidden');
}
});
}
document.getElementById('filtreler').classList.add('hidden');}
</script>
